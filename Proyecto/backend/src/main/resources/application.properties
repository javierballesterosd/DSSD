spring.application.name=backend
# Lee el .env de la raíz si existe (en IntelliJ alcanza con las variables de entorno del IDE, que tienen prioridad)
spring.config.import=optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#Bonita
bonita.base-url=${BONITA_BASE_URL:http://localhost:8080/bonita}
