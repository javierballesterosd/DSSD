<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-sm w-100" style="max-width: 420px">
    <div class="card-body p-4">
      <h1 class="h3 text-center mb-1">RescueSync</h1>
      <p class="text-center text-body-secondary mb-4">Ingresá para continuar</p>

      <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
          />
          <div class="invalid-feedback">Ingresá tu usuario.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="position-relative">
            <input
              id="password"
              [type]="mostrarPassword() ? 'text' : 'password'"
              class="form-control pe-5"
              formControlName="password"
              (input)="actualizarEstadoPassword()"
              [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
            />
            @if (passwordTieneTexto()) {
              <button
                type="button"
                class="position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent p-2 me-1"
                style="color: #2271b1"
                [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                [attr.title]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                (click)="alternarVisibilidadPassword()"
              >
                @if (mostrarPassword()) {
                  <svg
                    aria-hidden="true"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5Zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5Zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3Z"
                    />
                  </svg>
                } @else {
                  <svg
                    aria-hidden="true"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5Zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5Zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3Z"
                    />
                    <path d="m3 3 18 18" fill="none" stroke="currentColor" stroke-width="2" />
                  </svg>
                }
                <span class="visually-hidden">
                  {{ mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña' }}
                </span>
              </button>
            }
          </div>
          <div
            class="invalid-feedback"
            [class.d-block]="form.controls.password.touched && form.controls.password.invalid"
          >
            Ingresá tu contraseña.
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Ingresando...
          } @else {
            Ingresar
          }
        </button>
      </form>
    </div>
  </div>
</div>
