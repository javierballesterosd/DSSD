<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-sm w-100" style="max-width: 420px">
    <div class="card-body p-4">
      <h1 class="h3 text-center mb-1">RescueSync</h1>
      <p class="text-center text-body-secondary mb-4">Ingresá para continuar</p>

      <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
          />
          <div class="invalid-feedback">Ingresá tu usuario.</div>
        </div>

        <div class="mb-3">
          <label for="rol" class="form-label">Perfil</label>
          <select id="rol" class="form-select" formControlName="rol">
            @for (rol of roles; track rol) {
              <option [value]="rol">{{ rolLabel[rol] }}</option>
            }
          </select>
          <div class="form-text">
            Solo desarrollo: cuando exista el login real, el rol lo define el usuario.
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div>
  </div>
</div>
